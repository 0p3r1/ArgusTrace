[project]
name = "argustrace"
version = "0.1.0"
description = "Framework OSINT modulaire"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "typer",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argustrace"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
