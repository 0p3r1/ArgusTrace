[project]
name = "argustrace"
version = "0.3.0"
description = "Framework OSINT modulaire"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "packaging>=26.2",
    "phonenumbers>=9.0.35",
    "pydantic>=2",
    "typer",
    "uvicorn[standard]>=0.52.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argustrace"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
