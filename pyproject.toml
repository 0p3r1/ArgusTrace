[project]
name = "argustrace"
version = "0.4.0"
description = "Framework OSINT modulaire"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "packaging>=26.2",
    "phonenumbers>=9.0.35",
    "pydantic>=2",
    "typer",
    "uvicorn[standard]>=0.52.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argustrace"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["argustrace"]

[tool.coverage.report]
# The lines the suite deliberately cannot reach: `run_hardened` is stubbed by
# the `fake_docker` fixture, so the real `docker run` call and its failure
# branches are covered by hand, not here. See CLAUDE.md's testing section.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Correctness and security rules, not formatting: F catches real bugs
# (unused/undefined names), B catches likely mistakes, S is bandit's security
# lint — which matters for a tool that shells out to Docker and fetches
# attacker-influenced URLs. E501 stays off deliberately: the long lines are
# almost all human-written option descriptions in registry.py that read worse
# wrapped, and reformatting them would bury real changes in noise.
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "E501",
    # S108 flags "/tmp" as an insecure host temp path. Every occurrence here
    # is a path *inside* a single-use hardened container — `--tmpfs /tmp` is
    # itself part of the sandbox, and HOME=/tmp is what lets Maigret and
    # theHarvester start under `--read-only`. Nothing touches the host's /tmp.
    "S108",
    # B008 forbids function calls in argument defaults, but that is the
    # required idiom for Typer's `typer.Option(...)` and FastAPI's
    # `Header(...)`/`Depends(...)`.
    "B008",
    # UP042 wants `StrEnum` instead of `(str, Enum)`. Declined: StrEnum
    # changes what `str(Status.FOUND)` returns, and `Status` is a documented
    # core invariant consumed by the API, the CLI and the frontend. Not worth
    # a behavioural change for a stylistic gain.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Asserts are the entire point of a test file. The security lints below fire
# on fixtures that exist precisely to exercise the guards: throwaway tokens
# (S105/S106) and the "0.0.0.0" that test_api_auth.py checks is *refused*
# without one (S104).
"tests/*" = ["S101", "S104", "S105", "S106"]
